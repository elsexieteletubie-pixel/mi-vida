<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Vida</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2421;--mu:#6b726d;--ac:#2f7d62;--ac2:#e7f2ed;--bd:#e3e0d8;--rd:#c4493a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151816;--card:#1e2220;--tx:#eceee9;--mu:#98a09a;--ac:#5fc29c;--ac2:#243a31;--bd:#2d332f;--rd:#e8806f}}
:root[data-theme="dark"]{--bg:#151816;--card:#1e2220;--tx:#eceee9;--mu:#98a09a;--ac:#5fc29c;--ac2:#243a31;--bd:#2d332f;--rd:#e8806f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--mu);margin:2px 0 14px;text-transform:capitalize}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .g{flex:1;min-width:0;overflow-wrap:anywhere}
.done .g{text-decoration:line-through;color:var(--mu)}
.add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}
input[type=text]{flex:1}
textarea{width:100%;min-height:260px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:1.05rem;padding:4px 8px;font-family:inherit}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--ac2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.3rem}
.stat span{color:var(--mu);font-size:.85rem}
.days{display:flex;gap:4px}
.d{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:.7rem;cursor:pointer;padding:0}
.d.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);padding:0}
.in{color:var(--ac)}.out{color:var(--rd)}.m{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:14px}
.hb{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw{color:var(--mu);font-size:.8rem}
.cd{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;position:relative;font:inherit;padding:0}
.cd.v{visibility:hidden}
.cd.hoy{border-color:var(--ac);font-weight:700}
.cd.on{background:var(--ac);color:#fff}
.cd i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--rd)}
.cd.on i{background:#fff}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;max-width:704px;margin:0 auto;z-index:20}
.toast{background:var(--card);border:1px solid var(--rd);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:8px;justify-content:space-between;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div id="toasts"></div>
<div class="w">
<div id="auth"></div>
<div id="app" style="display:none">
<div class="hb"><div><h1>Hola, <span id="hi"></span> 👋</h1><p class="sub" id="fecha"></p></div>
<div><button class="x" id="bell" title="Activar avisos">🔔</button><button class="x" id="tm" title="Tema">🌓</button><button class="x" id="out">Salir</button></div></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</div>
</div>
<script>
var U=null,S=null,tab="tareas",sel=iso(new Date()),cm=new Date(),reg=false,shown={};
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sha(s){if(window.crypto&&crypto.subtle){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve("f"+h)}
function save(){ls("mv_d_"+U,S)}
function toast(key,msg){if(shown[key])return;shown[key]=1;var d=document.createElement("div");d.className="toast";d.innerHTML="<span>"+msg+"</span><button class='x'>✕</button>";d.querySelector("button").onclick=function(){d.remove()};$("toasts").appendChild(d)}
function notify(t,b){try{if(!("Notification" in window)||Notification.permission!=="granted")return;var o={body:b,icon:"icon-192.png"};
if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.showNotification(t,o);else new Notification(t,o)}).catch(function(){})}else new Notification(t,o)}catch(e){}}
function loginView(){$("app").style.display="none";$("auth").style.display="block";
$("auth").innerHTML='<div class="card" style="max-width:380px;margin:40px auto"><h1>Mi Vida 🌿</h1><p class="sub" style="text-transform:none">'+(reg?"Crea tu cuenta":"Inicia sesión")+'</p><input type="text" id="un" placeholder="Tu nombre" maxlength="30" autocomplete="username" style="width:100%;margin-bottom:8px"><input type="password" id="up" placeholder="Contraseña (mínimo 4)" autocomplete="'+(reg?"new-password":"current-password")+'" style="width:100%;margin-bottom:8px"><p id="am" class="out" style="min-height:1.4em;margin:4px 0"></p><button class="btn" id="go" style="width:100%">'+(reg?"Crear cuenta":"Entrar")+'</button><p style="text-align:center"><button class="x" id="sw" style="font-size:.95rem">'+(reg?"Ya tengo cuenta":"Soy nuevo: crear cuenta")+'</button></p><small class="m">Las cuentas se guardan solo en este dispositivo.</small></div>';
$("go").onclick=login;$("up").onkeydown=function(e){if(e.key==="Enter")login()};$("sw").onclick=function(){reg=!reg;loginView()}}
function login(){var n=$("un").value.trim(),p=$("up").value,k=n.toLowerCase(),us=ls("mv_users")||{},m=$("am");
if(!n||p.length<4){m.textContent="Escribe tu nombre y una contraseña de 4 caracteres o más.";return}
sha(k+"|"+p).then(function(h){
if(reg){if(us[k]){m.textContent="Ese nombre ya existe. Entra o elige otro.";return}us[k]={n:n,h:h};ls("mv_users",us);start(k)}
else{if(!us[k]||us[k].h!==h){m.textContent="Nombre o contraseña incorrectos.";return}start(k)}})}
function start(k){U=k;ls("mv_session",k);var us=ls("mv_users")||{};
S=Object.assign({tasks:[],habits:[],goals:[],money:[],notes:"",hr:"20:00",hn:""},ls("mv_d_"+k)||{});
$("auth").style.display="none";$("app").style.display="block";$("hi").textContent=us[k].n;
$("fecha").textContent=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
shown={};$("toasts").innerHTML="";draw();checkAlerts()}
$("out").onclick=function(){try{localStorage.removeItem("mv_session")}catch(e){}U=S=null;reg=false;$("toasts").innerHTML="";loginView()};
$("tm").onclick=function(){var d=document.documentElement,dk=d.getAttribute("data-theme")==="dark"||(!d.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);d.setAttribute("data-theme",dk?"light":"dark")};
$("bell").onclick=function(){if(!("Notification" in window)){toast("nn","Este navegador no permite avisos del sistema. En iPhone, añade la app a la pantalla de inicio. Los avisos dentro de la app sí funcionan.");return}
Notification.requestPermission().then(function(p){toast("np"+Date.now(),p==="granted"?"🔔 Avisos activados":"Avisos bloqueados. Actívalos en los ajustes del navegador.")})};
function checkAlerts(){if(!S)return;var now=new Date(),td=iso(now),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
S.tasks.forEach(function(t){if(t.d||!t.due)return;var due=t.due<td||(t.due===td&&(t.tm||"09:00")<=hm);if(!due)return;
toast("t"+t.t+t.due,"⏰ Pendiente: <b>"+esc(t.t)+"</b>"+(t.due<td?" (venció el "+t.due+")":""));
if(!t.n){t.n=1;save();notify("⏰ Tarea pendiente",t.t)}});
var f=S.habits.filter(function(h){return!h.days[td]});
if(f.length&&hm>=S.hr){var nm=f.map(function(h){return h.n}).join(", ");toast("h"+td,"🔥 Hoy aún no marcas: <b>"+esc(nm)+"</b>");if(S.hn!==td){S.hn=td;save();notify("🔥 Hábitos pendientes",nm)}}}
setInterval(checkAlerts,30000);document.addEventListener("visibilitychange",checkAlerts);
var T=[["tareas","✅ Tareas"],["cal","📅 Calendario"],["habitos","🔥 Hábitos"],["metas","🎯 Metas"],["dinero","💰 Dinero"],["notas","📝 Notas"]];
function tabs(){$("tabs").innerHTML=T.map(function(t){return'<button class="'+(t[0]===tab?"on":"")+'" data-t="'+t[0]+'">'+t[1]+"</button>"}).join("");
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;draw()}})}
function addForm(ph,extra){return'<div class="add"><input type="text" id="n" placeholder="'+ph+'" maxlength="120">'+(extra||"")+'<button class="btn" id="ok">Añadir</button></div>'}
function hook(fn){var n=$("n"),ok=$("ok");ok.onclick=function(){if(n.value.trim()){fn(n.value.trim());save();draw()}};n.onkeydown=function(e){if(e.key==="Enter")ok.onclick()}}
function rm(v,arr){v.querySelectorAll("[data-x]").forEach(function(e){e.onclick=function(){arr.splice(e.dataset.x,1);save();draw()}})}
function trows(f){var td=iso(new Date()),r=S.tasks.map(function(t,i){return[t,i]}).filter(function(a){return f(a[0])});
return r.length?r.map(function(a){var t=a[0],i=a[1],late=!t.d&&t.due&&t.due<td;
return'<div class="row '+(t.d?"done":"")+'"><input type="checkbox" data-c="'+i+'" '+(t.d?"checked":"")+'><span class="g">'+esc(t.t)+(t.due?'<br><small class="'+(late?"out":"m")+'">📅 '+t.due+(t.tm?" · "+t.tm:"")+(late?" · vencida":"")+"</small>":"")+'</span><button class="x" data-x="'+i+'">✕</button></div>'}).join(""):'<div class="empty">Nada por aquí.</div>'}
function tbind(v){v.querySelectorAll("[data-c]").forEach(function(e){e.onchange=function(){S.tasks[e.dataset.c].d=e.checked?1:0;save();draw()}});rm(v,S.tasks)}
function draw(){if(!S)return;tabs();var v=$("v"),td=iso(new Date());
if(tab==="tareas"){var p=S.tasks.filter(function(t){return!t.d}).length,h=S.tasks.length-p;
v.innerHTML='<div class="stats"><div class="stat"><b>'+p+'</b><span>Pendientes</span></div><div class="stat"><b>'+h+'</b><span>Hechas</span></div></div>'+addForm("¿Qué tienes que hacer?",'<input type="date" id="dt"><input type="time" id="tt">')+'<div class="card">'+trows(function(){return true})+(h?'<div style="text-align:right;margin-top:8px"><button class="x" id="lim">Borrar hechas</button></div>':"")+"</div>";
hook(function(x){S.tasks.unshift({t:x,d:0,n:0,due:$("dt").value,tm:$("tt").value})});tbind(v);
var l=$("lim");if(l)l.onclick=function(){S.tasks=S.tasks.filter(function(t){return!t.d});save();draw()}}
else if(tab==="cal"){var y=cm.getFullYear(),mo=cm.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),has={},c="";
S.tasks.forEach(function(t){if(t.due&&!t.d)has[t.due]=1});
["L","M","X","J","V","S","D"].forEach(function(d){c+='<div class="cw">'+d+"</div>"});
for(var i=0;i<off;i++)c+='<button class="cd v"></button>';
for(var d=1;d<=dim;d++){var k=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");c+='<button class="cd '+(k===sel?"on ":"")+(k===td?"hoy":"")+'" data-k="'+k+'">'+d+(has[k]?"<i></i>":"")+"</button>"}
v.innerHTML='<div class="card"><div class="hb" style="align-items:center;margin-bottom:8px"><button class="x" id="pv">◀</button><b style="text-transform:capitalize">'+cm.toLocaleDateString("es",{month:"long",year:"numeric"})+'</b><button class="x" id="nx">▶</button></div><div class="cal">'+c+'</div></div><div class="card"><b>📌 '+sel+'</b><div style="margin:10px 0">'+addForm("Tarea para este día",'<input type="time" id="tt">').replace('class="add"','class="add" style="margin-bottom:0"')+"</div>"+trows(function(t){return t.due===sel})+"</div>";
hook(function(x){S.tasks.unshift({t:x,d:0,n:0,due:sel,tm:$("tt").value})});tbind(v);
$("pv").onclick=function(){cm=new Date(y,mo-1,1);draw()};$("nx").onclick=function(){cm=new Date(y,mo+1,1);draw()};
v.querySelectorAll("[data-k]").forEach(function(e){e.onclick=function(){sel=e.dataset.k;draw()}})}
else if(tab==="habitos"){var ds=[],L="DLMXJVS";for(var k2=6;k2>=0;k2--){var dd=new Date();dd.setDate(dd.getDate()-k2);ds.push(dd)}
v.innerHTML='<div class="card">🔔 Avisarme si falta algún hábito a las <input type="time" id="hr" value="'+S.hr+'"></div>'+addForm("Nuevo hábito (ej. beber agua)")+'<div class="card">'+(S.habits.length?S.habits.map(function(h,i){
var rc=0,c2=new Date();if(!h.days[iso(c2)])c2.setDate(c2.getDate()-1);while(h.days[iso(c2)]){rc++;c2.setDate(c2.getDate()-1)}
return'<div class="row" style="flex-wrap:wrap"><span class="g"><b>'+esc(h.n)+'</b><br><small class="m">🔥 Racha: '+rc+" día"+(rc===1?"":"s")+'</small></span><div class="days">'+ds.map(function(d){return'<button class="d '+(h.days[iso(d)]?"on":"")+'" data-h="'+i+'" data-d="'+iso(d)+'">'+L[d.getDay()]+"</button>"}).join("")+'</div><button class="x" data-x="'+i+'">✕</button></div>'}).join(""):'<div class="empty">Crea tu primer hábito y márcalo cada día.</div>')+"</div>";
hook(function(x){S.habits.push({n:x,days:{}})});
$("hr").onchange=function(e){S.hr=e.target.value||"20:00";S.hn="";save()};
v.querySelectorAll("[data-h]").forEach(function(e){e.onclick=function(){var h=S.habits[e.dataset.h];if(h.days[e.dataset.d])delete h.days[e.dataset.d];else h.days[e.dataset.d]=1;save();draw()}});rm(v,S.habits)}
else if(tab==="metas"){v.innerHTML=addForm("Nueva meta (ej. ahorrar para viaje)")+(S.goals.length?S.goals.map(function(g,i){return'<div class="card"><div class="hb"><b>'+esc(g.n)+'</b><span><b class="in">'+g.p+'%</b><button class="x" data-x="'+i+'">✕</button></span></div><div class="bar"><i style="width:'+g.p+'%"></i></div><input type="range" min="0" max="100" step="5" value="'+g.p+'" data-g="'+i+'"></div>'}).join(""):'<div class="card empty">Define lo que quieres lograr.</div>');
hook(function(x){S.goals.push({n:x,p:0})});
v.querySelectorAll("[data-g]").forEach(function(e){e.onchange=function(){S.goals[e.dataset.g].p=+e.value;save();draw()}});rm(v,S.goals)}
else if(tab==="dinero"){var ing=0,gas=0;S.money.forEach(function(m){m.t==="i"?ing+=m.m:gas+=m.m});
var f=function(n){return"Q"+n.toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2})};
v.innerHTML='<div class="stats"><div class="stat"><b class="in">'+f(ing)+'</b><span>Ingresos</span></div><div class="stat"><b class="out">'+f(gas)+'</b><span>Gastos</span></div><div class="stat"><b>'+f(ing-gas)+'</b><span>Balance</span></div></div>'+
addForm("Concepto",'<input type="number" id="mo" placeholder="Monto" step="0.01" min="0" style="width:100px"><select id="ty"><option value="g">Gasto</option><option value="i">Ingreso</option></select>')+
'<div class="card">'+(S.money.length?S.money.map(function(m,i){return'<div class="row"><span class="g">'+esc(m.c)+'<br><small class="m">'+m.f+'</small></span><b class="'+(m.t==="i"?"in":"out")+'">'+(m.t==="i"?"+":"−")+f(m.m)+'</b><button class="x" data-x="'+i+'">✕</button></div>'}).join(""):'<div class="empty">Registra tus ingresos y gastos.</div>')+"</div>";
hook(function(x){var m=parseFloat($("mo").value);if(!(m>0))return;S.money.unshift({c:x,m:m,t:$("ty").value,f:new Date().toLocaleDateString("es")})});rm(v,S.money)}
else{v.innerHTML='<div class="card"><textarea id="no" placeholder="Ideas, pendientes, diario, lo que quieras…">'+esc(S.notes)+'</textarea></div>';
$("no").oninput=function(e){S.notes=e.target.value;save()}}}
var ss=ls("mv_session"),uu=ls("mv_users")||{};if(ss&&uu[ss])start(ss);else loginView();
/*SW*/
</script>
</body>
</html>
